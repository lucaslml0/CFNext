name: CFNext Cloudflare Worker Auto Deploy

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfnext-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream and detect version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/PAICNI/CFNext.git /tmp/CFNext
          UPSTREAM_VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("/tmp/CFNext/README.md").read_text(encoding="utf-8")
          versions = re.findall(r"更新日志[^\r\n]*?\bV([0-9]+(?:\.[0-9]+)+)", text, re.I)
          if not versions:
              raise SystemExit("Could not extract upstream version")
          print(max(versions, key=lambda v: tuple(int(p) for p in v.split("."))))
          PY
          )"
          test -s "/tmp/CFNext/CFNext-小说混淆版.js"
          CURRENT_VERSION=""
          if [[ -f VERSION.txt ]]; then CURRENT_VERSION="$(tr -d '[:space:]' < VERSION.txt)"; fi
          echo "upstream=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Upstream version: $UPSTREAM_VERSION"
          echo "Recorded deployed version: ${CURRENT_VERSION:-<empty>}"

      - name: Skip if unchanged
        if: steps.version.outputs.upstream == steps.version.outputs.current
        run: echo "Already deployed; no update required."

      - name: Validate required settings
        if: steps.version.outputs.upstream != steps.version.outputs.current
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CFNEXT_LOGIN: ${{ vars.CFNEXT_LOGIN }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$CFNEXT_LOGIN" || { echo "Missing required repository variable CFNEXT_LOGIN"; exit 1; }

      - name: Deploy upstream Worker
        if: steps.version.outputs.upstream != steps.version.outputs.current
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.CFNEXT_WORKER_NAME }}
          CFNEXT_LOGIN: ${{ vars.CFNEXT_LOGIN }}
          CFNEXT_D: ${{ vars.CFNEXT_D }}
          CFNEXT_HOST: ${{ vars.CFNEXT_HOST }}
          CFNEXT_ADMIN: ${{ secrets.CFNEXT_ADMIN }}
        shell: bash
        run: |
          set -euo pipefail
          WORKER_NAME="${WORKER_NAME:-cfnext}"
          ARGS=(--var "login:${CFNEXT_LOGIN}")
          if [[ -n "${CFNEXT_D:-}" ]]; then ARGS+=(--var "D:${CFNEXT_D}"); fi
          if [[ -n "${CFNEXT_HOST:-}" ]]; then ARGS+=(--var "HOST:${CFNEXT_HOST}"); fi
          npx --yes wrangler@4 deploy "/tmp/CFNext/CFNext-小说混淆版.js" --name "$WORKER_NAME" --compatibility-date "2026-10-12" "${ARGS[@]}"
          if [[ -n "${CFNEXT_ADMIN:-}" ]]; then
            printf '%s' "$CFNEXT_ADMIN" | npx --yes wrangler@4 secret put ADMIN --name "$WORKER_NAME"
          fi

      - name: Record deployed version
        if: steps.version.outputs.upstream != steps.version.outputs.current
        env:
          UPSTREAM_VERSION: ${{ steps.version.outputs.upstream }}
        run: |
          set -euo pipefail
          printf '%s\n' "$UPSTREAM_VERSION" > VERSION.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record deployed CFNext version $UPSTREAM_VERSION"
          git push
