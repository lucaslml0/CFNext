name: CFNext Cloudflare Worker Auto Deploy

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfnext-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream and detect version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/PAICNI/CFNext.git /tmp/CFNext
          UPSTREAM_VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("/tmp/CFNext/README.md").read_text(encoding="utf-8")
          versions = re.findall(r"更新日志[^\r\n]*?\bV([0-9]+(?:\.[0-9]+)+)", text, re.I)
          if not versions:
              raise SystemExit("Could not extract upstream version")
          print(max(versions, key=lambda v: tuple(int(p) for p in v.split("."))))
          PY
          )"
          test -s "/tmp/CFNext/CFNext-小说混淆版.js"
          CURRENT_VERSION=""
          if [[ -f VERSION.txt ]]; then CURRENT_VERSION="$(tr -d '[:space:]' < VERSION.txt)"; fi
          echo "upstream=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Upstream version: $UPSTREAM_VERSION"
          echo "Recorded deployed version: ${CURRENT_VERSION:-<empty>}"

      - name: Skip if unchanged
        if: steps.version.outputs.upstream == steps.version.outputs.current
        run: echo "Already deployed; no update required."

      - name: Validate required settings
        if: steps.version.outputs.upstream != steps.version.outputs.current
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CFNEXT_LOGIN: ${{ vars.CFNEXT_LOGIN }}
          CFNEXT_KV_NAMESPACE_ID: ${{ vars.CFNEXT_KV_NAMESPACE_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$CFNEXT_LOGIN" || { echo "Missing required repository variable CFNEXT_LOGIN"; exit 1; }
          test -n "$CFNEXT_KV_NAMESPACE_ID" || { echo "Missing required repository variable CFNEXT_KV_NAMESPACE_ID (Cloudflare KV namespace ID)"; exit 1; }

      - name: Create Wrangler config and deploy upstream Worker
        if: steps.version.outputs.upstream != steps.version.outputs.current
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.CFNEXT_WORKER_NAME }}
          CFNEXT_LOGIN: ${{ vars.CFNEXT_LOGIN }}
          CFNEXT_D: ${{ vars.CFNEXT_D }}
          CFNEXT_HOST: ${{ vars.CFNEXT_HOST }}
          CFNEXT_ADMIN: ${{ secrets.CFNEXT_ADMIN }}
          CFNEXT_KV_NAMESPACE_ID: ${{ vars.CFNEXT_KV_NAMESPACE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          WORKER_NAME="${WORKER_NAME:-cfnext}"
          export WORKER_NAME CFNEXT_LOGIN CFNEXT_D CFNEXT_HOST CFNEXT_KV_NAMESPACE_ID
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def toml_string(value):
              return json.dumps(value, ensure_ascii=False)

          lines = [
              f"name = {toml_string(os.environ['WORKER_NAME'])}",
              f"main = {toml_string('/tmp/CFNext/CFNext-小说混淆版.js')}",
              'compatibility_date = "2026-10-12"',
              "",
              "[vars]",
              f"login = {toml_string(os.environ['CFNEXT_LOGIN'])}",
          ]
          for env_name, var_name in (("CFNEXT_D", "D"), ("CFNEXT_HOST", "HOST")):
              value = os.environ.get(env_name, "")
              if value:
                  lines.append(f"{var_name} = {toml_string(value)}")
          lines.extend([
              "",
              "[[kv_namespaces]]",
              'binding = "K"',
              f"id = {toml_string(os.environ['CFNEXT_KV_NAMESPACE_ID'])}",
              "",
          ])
          Path("/tmp/CFNext/wrangler.toml").write_text("\n".join(lines), encoding="utf-8")
          PY
          npx --yes wrangler@4 deploy --config /tmp/CFNext/wrangler.toml
          if [[ -n "${CFNEXT_ADMIN:-}" ]]; then
            printf '%s' "$CFNEXT_ADMIN" | npx --yes wrangler@4 secret put ADMIN --name "$WORKER_NAME"
          fi

      - name: Record deployed version
        if: steps.version.outputs.upstream != steps.version.outputs.current
        env:
          UPSTREAM_VERSION: ${{ steps.version.outputs.upstream }}
        run: |
          set -euo pipefail
          printf '%s\n' "$UPSTREAM_VERSION" > VERSION.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record deployed CFNext version $UPSTREAM_VERSION"
          git push
